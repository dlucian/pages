<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 820" width="100%" role="img" aria-label="Six-step pipeline: plan, plan review, implement, verify, code review, merge gate, alternating between two providers" style="max-width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif"><defs><marker id="kfarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c3c8d0"/></marker></defs><rect width="1016" height="820" fill="#ffffff"/><text x="44" y="42" font-size="24" font-weight="650" fill="#14181f">From an idea to production, without reading the code</text><text x="44" y="68" font-size="16" fill="#6b7280">No step is checked by the model that produced it. Where the writer is Anthropic, the reviewer is OpenAI.</text><rect x="44" y="104" width="440" height="132" rx="10" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.4"/><text x="60" y="130" font-size="17" font-weight="650" fill="#14181f">1  Plan</text><text x="60" y="152" font-size="15.2" fill="#6b7280">The task is fully specified before any code exists.</text><text x="60" y="171" font-size="15.2" fill="#6b7280">This is where the quality comes from.</text><text x="60" y="220" font-size="13.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" fill="#6b7280">Fable 5.1  ·  Anthropic</text><rect x="532" y="104" width="440" height="132" rx="10" fill="#ffffff" stroke="#e0562d" stroke-width="2"/><text x="548" y="130" font-size="17" font-weight="650" fill="#e0562d">2  Plan review</text><text x="548" y="152" font-size="15.2" fill="#6b7280">Codex reads the plan the way it would read code, and</text><text x="548" y="171" font-size="15.2" fill="#6b7280">names the weak spots before they are built.</text><text x="548" y="220" font-size="13.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" fill="#e0562d">Codex  ·  OpenAI</text><rect x="44" y="300" width="440" height="132" rx="10" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.4"/><text x="60" y="326" font-size="17" font-weight="650" fill="#14181f">3  Implement</text><text x="60" y="348" font-size="15.2" fill="#6b7280">Following a plan is close to mechanical, so it does</text><text x="60" y="367" font-size="15.2" fill="#6b7280">not need a frontier model.</text><text x="60" y="416" font-size="13.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" fill="#6b7280">Sonnet 5  ·  Anthropic</text><rect x="532" y="300" width="440" height="132" rx="10" fill="#ffffff" stroke="#e0562d" stroke-width="2"/><text x="548" y="326" font-size="17" font-weight="650" fill="#e0562d">4  Verify</text><text x="548" y="348" font-size="15.2" fill="#6b7280">Does the code follow the plan, and did it add</text><text x="548" y="367" font-size="15.2" fill="#6b7280">anything on the way? Findings go straight back to</text><text x="548" y="386" font-size="15.2" fill="#6b7280">step 3.</text><text x="548" y="416" font-size="13.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" fill="#e0562d">Fable 5.1  ·  Anthropic</text><rect x="44" y="496" width="440" height="132" rx="10" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.4"/><text x="60" y="522" font-size="17" font-weight="650" fill="#14181f">5  Code review</text><text x="60" y="544" font-size="15.2" fill="#6b7280">A different provider reads the diff. Different blind</text><text x="60" y="563" font-size="15.2" fill="#6b7280">spots, so it finds what the author cannot.</text><text x="60" y="612" font-size="13.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" fill="#6b7280">Codex  ·  OpenAI</text><rect x="532" y="496" width="440" height="132" rx="10" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.4"/><text x="548" y="522" font-size="17" font-weight="650" fill="#14181f">6  Merge gate</text><text x="548" y="544" font-size="15.2" fill="#6b7280">Unit tests, a coverage target, and an agent breaking</text><text x="548" y="563" font-size="15.2" fill="#6b7280">the code on purpose to see whether the tests notice.</text><text x="548" y="612" font-size="13.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" fill="#6b7280">CI</text><path d="M484.0 170.0 L522.0 170.0" fill="none" stroke="#c3c8d0" stroke-width="1.6" marker-end="url(#kfarrow)"/><path d="M484.0 366.0 L522.0 366.0" fill="none" stroke="#c3c8d0" stroke-width="1.6" marker-end="url(#kfarrow)"/><path d="M484.0 562.0 L522.0 562.0" fill="none" stroke="#c3c8d0" stroke-width="1.6" marker-end="url(#kfarrow)"/><path d="M752.0 236.0L752.0 268.0L264.0 268.0L264.0 290.0" fill="none" stroke="#c3c8d0" stroke-width="1.6" marker-end="url(#kfarrow)" stroke-linejoin="round"/><path d="M752.0 432.0L752.0 464.0L264.0 464.0L264.0 486.0" fill="none" stroke="#c3c8d0" stroke-width="1.6" marker-end="url(#kfarrow)" stroke-linejoin="round"/><rect x="44" y="674" width="928" height="98" rx="10" fill="#f4f5f7" stroke="#c3c8d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="60" y="700" font-size="17" font-weight="650" fill="#14181f">Me, on some of them</text><text x="60" y="722" font-size="15.2" fill="#6b7280">I skim for shape, not correctness. Small methods, things doing what they say, no seven parameters, comments only</text><text x="60" y="741" font-size="15.2" fill="#6b7280">where a decision needs explaining. You can tell elegant code by looking at it, even when you do not follow what it</text><text x="60" y="760" font-size="15.2" fill="#6b7280">does.</text><text x="44" y="806" font-size="15.5" fill="#6b7280">Steps 2 and 4 were added last. Before them, a code review routinely found six to ten issues per task.</text></svg>